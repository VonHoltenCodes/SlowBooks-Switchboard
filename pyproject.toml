[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbplive"
description = "SlowBooks Switchboard (sbplive): Claude and other MCP hosts work a SlowBooks Pro company's books through its API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Trent Von Holten" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
sbplive = "sbplive.cli:main"

[project.urls]
Homepage = "https://www.slowbookspro.com"
Source = "https://github.com/VonHoltenCodes/SlowBooks-Switchboard"

[tool.setuptools]
packages = ["sbplive"]

[tool.setuptools.dynamic]
version = { attr = "sbplive.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
