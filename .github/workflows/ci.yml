name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (standard library only, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest and nothing else
        run: python -m pip install pytest==9.0.2
      - name: Prove the MCP client is absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('mcp') is not None)"
      - name: Run the tests (the contract test skips here)
        run: python -m pytest -q -rs

  contract:
    name: Contract test (official MCP client)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the contract test, which must not skip
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_contract.py | tee contract.txt
          if grep -q skipped contract.txt; then
            echo "The contract test skipped, so it proved nothing."
            exit 1
          fi
